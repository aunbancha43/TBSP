<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PM Label - TBSP</title>
<style>
  :root { --blue:#1f4e9c; --red:#c8202a; }
  * { box-sizing: border-box; }
  body { margin:0; background:#e9ecef; font-family: Arial, "Sarabun", sans-serif; }

  /* แถบควบคุม (ไม่แสดงตอนพิมพ์) */
  .toolbar { background:#fff; padding:12px 16px; display:flex; flex-wrap:wrap; gap:10px; align-items:end;
             position:sticky; top:0; z-index:10; box-shadow:0 1px 4px rgba(0,0,0,.15); }
  .toolbar label { font-size:12px; display:flex; flex-direction:column; gap:2px; }
  .toolbar input { padding:4px 6px; border:1px solid #aaa; border-radius:4px; font-size:13px; width:120px; }
  .toolbar input.sm { width:70px; }
  .toolbar button { padding:6px 12px; border:0; border-radius:4px; background:#1f4e9c; color:#fff; cursor:pointer; font-size:13px; }
  .toolbar button.gray { background:#6c757d; }
  .toolbar button.print { background:#198754; }

  /* หน้ากระดาษ A4 */
  .sheet { width:210mm; height:297mm; margin:12px auto; background:#fff; padding:10mm 8mm;
           display:grid; grid-template-columns:repeat(2,97mm); grid-template-rows:repeat(9,30mm);
           gap:1.5mm 2mm; justify-content:center; box-shadow:0 0 6px rgba(0,0,0,.25); }

  /* ป้าย */
  .label { border:1.2px solid #000; display:grid; grid-template-columns:30% 70%; overflow:hidden; }
  .logo { display:flex; align-items:center; justify-content:center; padding:1mm; border-right:1px solid #999; }
  .logo svg, .logo img { width:100%; height:auto; max-height:100%; }
  .info { padding:.6mm 1.5mm; display:flex; flex-direction:column; justify-content:space-between; }
  .title { text-align:center; font-weight:bold; font-size:9.5pt; line-height:1.1; }
  .row { display:flex; align-items:center; gap:1mm; font-size:7.5pt; }
  .row span { width:17mm; flex-shrink:0; }
  .row input { flex:1; min-width:0; border:0; border-bottom:1px solid #000; font-size:8pt; padding:0; height:4mm;
               background:transparent; font-family:inherit; border-radius:0; }
  .row input:focus { outline:none; background:#fff8c5; }

  @media print {
    @page { size:A4; margin:0; }
    body { background:#fff; }
    .toolbar { display:none; }
    .sheet { margin:0; box-shadow:none; page-break-after:always; }
    .row input:focus { background:transparent; }
    * { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  }
</style>
</head>
<body>

<div class="toolbar">
  <label>คำนำหน้า NO#<input id="prefix" value="PM-"></label>
  <label>เลขเริ่มต้น<input id="start" class="sm" type="number" value="1"></label>
  <label>จำนวนหลัก<input id="digits" class="sm" type="number" value="3"></label>
  <button onclick="autoNumber()">เติมเลข NO# อัตโนมัติ</button>

  <label>Description (ทุกป้าย)<input id="allDesc"></label>
  <label>Date PM (ทุกป้าย)<input id="allDate" type="date"></label>
  <label>PM By (ทุกป้าย)<input id="allBy"></label>
  <button onclick="fillAll()">ใส่ทุกป้าย</button>

  <label>Due PM (เดือนถัดไป)<input id="months" class="sm" type="number" value="6"></label>
  <button onclick="calcDue()">คำนวณ Due PM</button>

  <button class="gray" onclick="clearAll()">ล้างข้อมูล</button>
  <button class="print" onclick="window.print()">พิมพ์</button>
</div>

<div class="sheet" id="sheet"></div>

<script>
const LOGO = `
<svg viewBox="0 0 100 80" xmlns="http://www.w3.org/2000/svg">
  <polygon points="8,4 78,4 96,22 8,22" fill="#1f4e9c"/>
  <text x="50" y="52" font-size="34" font-weight="900" text-anchor="middle" font-family="Arial Black, Arial">TBSP.</text>
  <polygon points="6,58 96,58 96,60 78,76 6,76" fill="#c8202a"/>
</svg>`;
/* หากมีไฟล์โลโก้จริง ให้แทน LOGO ด้วย: '<img src="logo.png">' */

const sheet = document.getElementById('sheet');

function labelHTML(i){
  return `
  <div class="label">
    <div class="logo">${LOGO}</div>
    <div class="info">
      <div class="title">Preventive maintenance</div>
      <div class="row"><span>NO# :</span><input data-f="no" data-i="${i}"></div>
      <div class="row"><span>Description :</span><input data-f="desc" data-i="${i}"></div>
      <div class="row"><span>Date PM :</span><input type="date" data-f="date" data-i="${i}"></div>
      <div class="row"><span>Due PM :</span><input type="date" data-f="due" data-i="${i}"></div>
      <div class="row"><span>PM By :</span><input data-f="by" data-i="${i}"></div>
    </div>
  </div>`;
}
for(let i=0;i<18;i++) sheet.insertAdjacentHTML('beforeend', labelHTML(i));

const all = f => [...document.querySelectorAll(`input[data-f="${f}"]`)];

function autoNumber(){
  const p = document.getElementById('prefix').value;
  const s = +document.getElementById('start').value || 1;
  const d = +document.getElementById('digits').value || 3;
  all('no').forEach((el,i)=> el.value = p + String(s+i).padStart(d,'0'));
  save();
}
function fillAll(){
  const map = {desc:'allDesc', date:'allDate', by:'allBy'};
  for(const f in map){
    const v = document.getElementById(map[f]).value;
    if(v) all(f).forEach(el=> el.value = v);
  }
  save();
}
function calcDue(){
  const m = +document.getElementById('months').value || 0;
  const dues = all('due');
  all('date').forEach((el,i)=>{
    if(!el.value) return;
    const d = new Date(el.value);
    d.setMonth(d.getMonth()+m);
    dues[i].value = d.toISOString().slice(0,10);
  });
  save();
}
function clearAll(){
  if(!confirm('ล้างข้อมูลทั้งหมดหรือไม่?')) return;
  document.querySelectorAll('.label input').forEach(el=> el.value='');
  save();
}

/* บันทึกอัตโนมัติในเบราว์เซอร์ */
const KEY='pm-label-data';
function save(){
  try{
    const data = [...document.querySelectorAll('.label input')].map(e=>e.value);
    localStorage.setItem(KEY, JSON.stringify(data));
  }catch(e){}
}
function load(){
  try{
    const data = JSON.parse(localStorage.getItem(KEY)||'[]');
    document.querySelectorAll('.label input').forEach((e,i)=> e.value = data[i]||'');
  }catch(e){}
}
document.addEventListener('input', e=>{ if(e.target.closest('.label')) save(); });
load();
</script>
</body>
</html>
